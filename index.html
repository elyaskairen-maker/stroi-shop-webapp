<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA SHOP</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header class="shop-header">
            <div class="shop-logo">
                <img id="logo-img" src="" alt="Logotip">
            </div>
            <h1 id="shop-title" class="shop-title"></h1>
            <button id="cart-button" class="cart-button">
                🛒 <span id="cart-counter">0</span>
            </button>
        </header>

        <section class="categories-section">
            <h2 class="section-title">📱 Kategoriyalar</h2>
            <div id="categories-container" class="categories-container">
                <!-- Kategoriyalar bu yerda -->
            </div>
        </section>

        <section class="products-section">
            <h2 class="section-title">🛍️ Mahsulotlar</h2>
            <main id="product-catalog" class="product-catalog">
                <!-- Mahsulotlar bu yerda -->
            </main>
        </section>

        <div id="loader" style="display: block;">
            <div class="loader-spinner"></div>
            Mahsulotlar yuklanmoqda...
        </div>
    </div>

    <!-- Savatcha oynasi -->
    <div id="cart-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-cart-button" class="close-button">×</button>
            <h2>🛒 Savatchangiz</h2>
            <div id="cart-items-container">
                <!-- Savatcha mahsulotlari -->
            </div>
            <div class="cart-summary" style="display: none;">
                <strong>💰 Jami: <span id="cart-total-price">0 so'm</span></strong>
            </div>
            <div id="order-form" style="display: none;">
                <h3>📋 Buyurtma berish</h3>
                <input type="text" id="customer-name-input" placeholder="👤 Ismingiz *" required>
                <input type="text" id="organization-input" placeholder="👤 Familiyangiz *" required>
                <input type="tel" id="phone-input" placeholder="📱 Telefon raqamingiz *" required>
                <input type="text" id="address-input" placeholder="📍 Manzilingiz *" required>
                <div class="payment-method-selection">
                    <label>
                        <input type="radio" name="payment-method" value="cash" checked> 💵 Naqd pul
                    </label>
                    <label>
                        <input type="radio" name="payment-method" value="card"> 💳 Karta
                    </label>
                </div>
                <button id="submit-order-button" class="submit-order-button">
                    ✅ Buyurtma berish
                </button>
            </div>
        </div>
    </div>

    <!-- Skriptlar -->
<script src="embedded-catalog.js?v=5"></script>
<script src="config/shop-config.js?v=5"></script>
<script src="config/categories.js?v=5"></script>
<script src="js/app.js?v=5"></script>
        
</body>
</html>
