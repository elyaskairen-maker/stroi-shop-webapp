<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header class="shop-header">
            <div class="shop-logo">
                <img id="logo-img" src="" alt="Логотип">
            </div>
            <h1 id="shop-title" class="shop-title"></h1>
            <button id="cart-button" class="cart-button">
                🛒 <span id="cart-counter">0</span>
            </button>
        </header>

        <section class="categories-section">
            <h2 class="section-title">🏗️ Категории товаров</h2>
            <div id="categories-container" class="categories-container">
                <!-- Категории будут добавлены здесь -->
            </div>
        </section>

        <section class="products-section">
            <h2 class="section-title">🛠️ Наши товары</h2>
            <main id="product-catalog" class="product-catalog">
                <!-- Карточки товаров будут добавлены здесь -->
            </main>
        </section>

        <div id="loader" style="display: block;">
            <div class="loader-spinner"></div>
            Загрузка товаров...
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cart-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-cart-button" class="close-button">×</button>
            <h2>🛒 Ваша корзина</h2>
            <div id="cart-items-container">
                <!-- Товары корзины будут добавлены здесь -->
            </div>
            <div class="cart-summary" style="display: none;">
                <strong>💰 Итого: <span id="cart-total-price">0 ₽</span></strong>
            </div>
            <div id="order-form" style="display: none;">
                <h3>📋 Оформление заказа</h3>
                <input type="text" id="customer-name-input" placeholder="👤 Ваше имя *" required>
                <input type="text" id="organization-input" placeholder="🏢 Организация *" required>
                <input type="tel" id="phone-input" placeholder="📱 Номер телефона *" required>
                <input type="text" id="address-input" placeholder="📍 Адрес доставки *" required>
                <div class="payment-method-selection">
                    <label>
                        <input type="radio" name="payment-method" value="cash" checked> 💵 Наличными
                    </label>
                    <label>
                        <input type="radio" name="payment-method" value="card"> 💳 Безналичный
                    </label>
                </div>
                <button id="submit-order-button" class="submit-order-button">
                    ✅ Оформить заказ
                </button>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <!-- ИСПРАВЛЕНО: Сначала встроенный каталог, потом конфиги -->
    <script src="embedded-catalog.js"></script>
    <script src="config/shop-config.js"></script>
    <script src="config/categories.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
